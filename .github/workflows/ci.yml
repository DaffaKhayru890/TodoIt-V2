name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dev@123
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_NAME: Todo Backend
      APP_VERSION: 0.1.0
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USER: root
      DATABASE_PASSWORD: dev@123
      DATABASE_NAME: todo_test
      DATABASE_SSL: "false"
      AUTH_JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      WEB_APP_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419881515e6d4ddc36a9e4bdf35b4a4
        with:
          bun-version: 1.4.4
      - name: install
        run: bun install --frozen-lockfile
      - name: audit
        run: bun pm ls
      - name: boundaries
        run: bun run lint
      - name: typecheck
        run: bun run typecheck
      - name: migrate
        run: bun node_modules/drizzle-kit/bin.cjs migrate
      - name: test
        run: bun test --env-file=.env.test
      - name: openapi
        run: bun run openapi:validate
      - name: build
        run: bun run build
