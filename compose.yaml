services:
  postgres:
    image: docker.io/library/postgres:17.5-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      # Kredensial development lokal. Jangan pernah dipakai di staging/production.
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dev@123
      POSTGRES_DB: todo_development
    ports:
      # Bind hanya ke localhost supaya database tidak terekspos ke jaringan host.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d todo_development"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      target: development
    container_name: todo-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - .env.development
    environment:
      # Di dalam network compose, database diakses lewat service name.
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./:/app
      # node_modules dalam image dipakai, tidak timpa oleh folder host.
      - /app/node_modules
    command: ["bun", "run", "dev"]
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:4000/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: todo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
    name: todo-postgres-data
