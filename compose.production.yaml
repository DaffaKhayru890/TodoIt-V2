# Production Compose untuk satu host. Bukan high availability.
# Secret tidak ditulis di file ini. Suntikkan lewat environment platform.
# PostgreSQL managed berada di luar file ini. Profil self-hosted-db hanya untuk
# laboratorium dan tidak memublikasikan port database.
services:
  api:
    image: ${TODO_IMAGE:?set TODO_IMAGE to an immutable digest}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
    env_file:
      - path: .env.production
        required: false
    command: ["bun", "dist/main.js"]
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:4000/health');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 20s

  worker:
    image: ${TODO_IMAGE:?set TODO_IMAGE to an immutable digest}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
    env_file:
      - path: .env.production
        required: false
    command: ["bun", "dist/worker.js"]
    restart: unless-stopped
    stop_grace_period: 20s

  postgres:
    profiles: ["self-hosted-db"]
    image: docker.io/library/postgres:17.5-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-todo_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-replace-before-use}
      POSTGRES_DB: ${DATABASE_NAME:-todo}
    volumes:
      - postgres-production:/var/lib/postgresql/data
    # Tidak ada ports. Database hanya terlihat di network Compose.
    restart: unless-stopped

volumes:
  postgres-production:
