root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  delay = 500
  include_ext = ["go", "yaml", "mod", "sum"]
  exclude_dir = ["tmp", "bin", "coverage", ".git", "docs"]
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
