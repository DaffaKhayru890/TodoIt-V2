name: todoit-test

services:
  postgres-test:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: "test@123"
      POSTGRES_DB: todolist_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d todolist_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - todoit-test

  unit-test:
    build:
      context: .
      target: test
    command: ["go", "test", "./..."]
    networks:
      - todoit-test

  integration-test:
    build:
      context: .
      target: test
    environment:
      APP_ENV: test
      DB_HOST: postgres-test
      DB_PORT: "5432"
      DB_USER: test_user
      DB_PASSWORD: "test@123"
      DB_NAME: todolist_test
      DB_SSLMODE: disable
      TEST_DATABASE_URL: postgres://test_user:test%40123@postgres-test:5432/todolist_test?sslmode=disable
    command: ["go", "test", "-tags=integration", "./tests/integration/..."]
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - todoit-test

volumes:
  postgres_test_data:

networks:
  todoit-test:
    driver: bridge
